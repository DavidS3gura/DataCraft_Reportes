name: Build & Deploy DataCraft Reportes Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_BACKEND: ghcr.io/davids3gura/datacraft-reportes-backend
  IMAGE_FRONTEND: ghcr.io/davids3gura/datacraft-reportes-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:staging
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:staging
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          scp -i ~/.ssh/vps.key -o StrictHostKeyChecking=accept-new -P 22 docker-compose.staging.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/datacraft/apps/datacraft-reportes-staging/docker-compose.staging.yml
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/datacraft/apps/datacraft-reportes-staging
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo -n docker login ghcr.io -u davids3gura --password-stdin
            sudo -n docker compose -f docker-compose.staging.yml pull
            sudo -n docker compose -f docker-compose.staging.yml up -d
