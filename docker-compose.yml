services:
  postgres:
    image: postgres:16-alpine
    container_name: datacraft-reportes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datacraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datacraft_dev}
      POSTGRES_DB: ${POSTGRES_DB:-datacraft_reportes}
    ports:
      - "5432:5432"
    volumes:
      - datacraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datacraft} -d ${POSTGRES_DB:-datacraft_reportes}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [datacraft-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datacraft-reportes-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datacraft}:${POSTGRES_PASSWORD:-datacraft_dev}@postgres:5432/${POSTGRES_DB:-datacraft_reportes}?schema=public
      STORAGE_PATH: /app/storage/uploads
    ports:
      - "3000:3000"
    volumes:
      - datacraft-storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [datacraft-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: datacraft-reportes-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [datacraft-network]

volumes:
  datacraft-postgres:
  datacraft-storage:

networks:
  datacraft-network:
    driver: bridge
