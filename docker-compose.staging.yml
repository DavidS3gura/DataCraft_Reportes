services:
  backend:
    image: ghcr.io/davids3gura/datacraft-reportes-backend:staging
    container_name: datacraft-reportes-backend-staging
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - datacraft-reportes-storage:/app/storage/uploads
    networks:
      - datacraft_database
      - datacraft-reportes-staging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/davids3gura/datacraft-reportes-frontend:staging
    container_name: datacraft-reportes-frontend-staging
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "sed -i 's|http://backend:3000|http://datacraft-reportes-backend-staging:3000|' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - datacraft_proxy
      - datacraft-reportes-staging

volumes:
  datacraft-reportes-storage:

networks:
  datacraft_database:
    external: true
    name: datacraft_database
  datacraft_proxy:
    external: true
    name: datacraft_proxy
  datacraft-reportes-staging:
    driver: bridge
